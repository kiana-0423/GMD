name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  serial:
    name: Serial build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            python3

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Run serial tests
        run: ctest --test-dir build --output-on-failure --verbose

      - name: Upload CTest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serial-ctest-logs
          path: |
            build/Testing/**/*.log
            build/Testing/**/*.xml
          if-no-files-found: ignore

  mpi:
    name: MPI build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            openmpi-bin \
            libopenmpi-dev

      - name: Configure MPI build
        run: >
          cmake -S . -B build-mpi
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGMD_ENABLE_MPI=ON

      - name: Build MPI target
        run: cmake --build build-mpi --parallel

      - name: List registered MPI tests
        run: ctest --test-dir build-mpi -N

      # The whole MPI suite, not a hardcoded name list. The previous -R filter
      # had to be edited by hand whenever a test was added, and had silently
      # fallen behind: the neighbour-rebuild, ghost-image-flag, degrees-of-
      # freedom, virial-reduction and Nose-Hoover restart tests were never run
      # on pull requests. The full suite takes seconds, so there is no reason
      # to select a subset.
      #
      # Some tests request 8 ranks, which exceeds the runner's core count, so
      # oversubscription must be allowed. OMPI_MCA_* covers Open MPI 4.x (what
      # Ubuntu ships) and PRTE_MCA_* covers Open MPI 5.x, so this keeps working
      # if the runner image moves on.
      - name: Run MPI tests
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
          PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
        run: ctest --test-dir build-mpi --output-on-failure

      - name: Upload CTest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mpi-ctest-logs
          path: |
            build-mpi/Testing/**/*.log
            build-mpi/Testing/**/*.xml
          if-no-files-found: ignore
